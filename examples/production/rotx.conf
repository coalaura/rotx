http {
	pow on;

	server_tokens auto;

	compress zstd gzip brotli;
	compress_cache memory;
	compress_memory_limit 32M;

	include conf/headers.conf;

	# Public website, versioned assets and application API.
	server {
		name example4ktqz7xw3mnvb5r7hj2p6sd7fg4c2vbn3mx7q2w5r7t6y2ak4;

		key_private keys/public/hs_ed25519_secret_key;
		key_public keys/public/hs_ed25519_public_key;

		root www/site;

		index index.html index.htm;

		cache 5m;

		location / {
			header_add Link "</assets/app.css>; rel=preload; as=style";
		}

		# Deploy fingerprinted assets here, along with any precompressed companions.
		location ^~ /assets/ {
			alias www/assets;

			cache 30d;

			compress_cache file;
		}

		# Keep the /api/ prefix: rotx forwards the entire request path.
		location /api/ {
			proxy_pass http://127.0.0.1:8080;
			proxy_buffer off;
			proxy_compress on;

			cache off;
		}

		# A small, public status snapshot; buffer the original response before compression.
		location = /status.json {
			proxy_pass http://127.0.0.1:8080;
			proxy_path /internal/public-status;
			proxy_buffer on;
			proxy_compress on;

			cache 10s;
		}

		# Serve already compressed downloads directly from www/site/downloads/.
		location ~ "^/downloads/.*[.](zip|gz|zst|br)$" {
			compress off;

			cache 1d;
		}

		# HTTP liveness only; this does not test Tor publication or upstream health.
		location = /healthz {
			cache off;

			header_set Content-Type "text/plain; charset=utf-8";

			return 200 "ok\n";
		}
	}

	# Private operations dashboard, reachable only by authorized Tor clients.
	server {
		name admin7xk2m5q4wv3bn6r7t5y2p6s4d7f2g3h6j2k5l7z4x7c2vm5n4b7;

		key_private keys/admin/hs_ed25519_secret_key;
		key_public keys/admin/hs_ed25519_public_key;

		# Public authorization keys: descriptor:x25519:<52-character base32 key>.
		# The directory must contain at least one .auth file; changes require restart.
		client_key keys/clients/deploy.auth;
		client_keys keys/clients/operators;

		server_tokens off;

		cache off;

		compress off;
		compress_cache off;

		location / {
			proxy_pass http://127.0.0.1:9090;
			proxy_buffer off;
			proxy_compress off;
		}
	}
}
